name: APK bauen

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:        # manuell über „Actions → APK bauen → Run workflow“

permissions:
  contents: write           # nötig, um bei Tags ein Release mit der APK anzulegen

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten (mit Cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle-Wrapper ausführbar machen
        run: chmod +x gradlew

      - name: Unit-Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug-APK bauen
        run: ./gradlew --no-daemon assembleDebug

      # Optional: signierte Release-APK, wenn die vier Secrets gesetzt sind
      # (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD – siehe README)
      - name: Release-APK bauen (signiert, falls Secrets vorhanden)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            ./gradlew --no-daemon assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            echo "Keine Signatur-Secrets gesetzt – es wird nur die Debug-APK bereitgestellt."
            ./gradlew --no-daemon assembleRelease
          fi

      - name: APKs sammeln
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SuloManiTR-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/SuloManiTR-release.apk || true
          ls -la dist

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: SuloManiTR-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Release anlegen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
